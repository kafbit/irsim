<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Play view: touch mode on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<dc-import name="CanvasPlayView" preset="phone" content="device" touch="auto" zoom="normal" menu="closed" commenting="no" rotated="no" theme="{{theme}}" hint-size="1440px,900px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"light","options":["light","dark"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme }
  }
}
</script>
</body>
</html>
