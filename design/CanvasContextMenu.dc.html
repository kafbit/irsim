<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Canvas context menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.cm-root{--pick:#14161a;--background:#ffffff;--foreground:#14161a;--card:#ffffff;--secondary:#f4f4f2;--muted-foreground:#5a606b;--accent:#f4f4f2;--border:#e4e4e0;--border-strong:#d6d7d2;--primary:#14161a;--primary-foreground:#ffffff;--destructive:#9a2a1a;--destructive-tint:#fbe9e6;--success:#e3f1e8;--success-foreground:#1b6b3a;--warning:#fdf0e2;--warning-foreground:#8a4a0b;--info:#e8f0fb;--info-foreground:#1e4e8c;--highlight:#f2a33a;--shell:#efefed;--surface:#fafaf8;--input:#8a8f98;--ring:#14161a;--popover:#ffffff;--muted:#efefeb;--play:#2563eb;--play-hover:#1d4ed8;--mock-bg:#f6f6f3;--mock-ink:#14161a;--mock-on-ink:#ecece8;--mock-card:#ffffff;--mock-line:#e4e4e0;--mock-bar:#d6d7d2;--mock-accent:#2563eb}
.cm-root.dark{--pick:#14161a;--background:#111214;--foreground:#ecece8;--card:#1a1b1e;--secondary:#26272b;--muted-foreground:#a3a7ae;--accent:#26272b;--border:#2d2e33;--border-strong:#3b3c42;--primary:#ecece8;--primary-foreground:#14161a;--destructive:#ff8f80;--destructive-tint:#3b1814;--success:#15301f;--success-foreground:#86d6a6;--warning:#3b2a14;--warning-foreground:#f3b66f;--info:#14263e;--info-foreground:#93bcf0;--highlight:#f2a33a;--shell:#0b0c0d;--surface:#121315;--input:#666b74;--ring:#ecece8;--popover:#1a1b1e;--muted:#26272b;--play:#60a5fa;--play-hover:#93c5fd}
</style>
</helmet>
<div dir="ltr" lang="en" role="menu" aria-label="{{label}}" class="cm-root {{themeClass}}" style="position: relative; display: flex; flex-direction: column; box-sizing: border-box; width: {{width}}px; padding: 6px; border: 1px solid var(--border); border-radius: 12px; background: var(--popover); color: var(--foreground); font-family: system-ui, sans-serif; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);">
<sc-for list="{{groups}}" as="g">
<sc-if value="{{g.sep}}" hint-placeholder-val="{{false}}"><div role="separator" style="height: 1px; margin: 6px 4px; background: var(--muted);"></div></sc-if>
<sc-for list="{{g.items}}" as="it">
<div role="menuitem" style="display: flex; align-items: center; gap: 10px; min-height: 38px; box-sizing: border-box; padding: 6px 10px; border-radius: 6px; font-size: 14px; color: {{it.color}}; background: {{it.bg}}; opacity: {{it.op}};"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; color: {{it.iconColor}};"><path d="{{it.d1}}"></path><path d="{{it.d2}}"></path><path d="{{it.d3}}"></path></svg><span style="flex: 1; white-space: nowrap;">{{it.label}}</span><sc-if value="{{it.key}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: var(--muted-foreground);">{{it.key}}</span></sc-if><sc-if value="{{it.sub}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; color: var(--muted-foreground);"><path d="m9 18 6-6-6-6"></path></svg></sc-if></div>
</sc-for>
</sc-for>
<sc-if value="{{showSub}}" hint-placeholder-val="{{false}}"><div role="menu" aria-label="{{subLabel}}" style="position: absolute; left: 100%; top: {{subTop}}px; margin-left: 4px; display: flex; flex-direction: column; box-sizing: border-box; width: 240px; padding: 6px; border: 1px solid var(--border); border-radius: 12px; background: var(--popover); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);"><sc-for list="{{subItems}}" as="si"><div role="menuitem" style="display: flex; align-items: center; gap: 10px; min-height: 38px; box-sizing: border-box; padding: 6px 10px; border-radius: 6px; font-size: 14px; color: {{si.color}}; background: {{si.bg}}; opacity: {{si.op}};"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; color: {{si.iconColor}};"><path d="{{si.d1}}"></path><path d="{{si.d2}}"></path><path d="{{si.d3}}"></path></svg><span style="flex: 1; white-space: nowrap;">{{si.label}}</span><sc-if value="{{si.key}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: var(--muted-foreground);">{{si.key}}</span></sc-if></div></sc-for></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"light","options":["light","dark"]},"target":{"editor":"enum","default":"frame","options":["frame","frames","section","part","mixed","page","canvas"]},"submenu":{"editor":"enum","default":"none","options":["none","agent","section","copy","page","view"]},"sidebar":{"editor":"enum","default":"no","options":["no","yes"]},"count":{"editor":"number","default":2},"session":{"editor":"enum","default":"one","options":["one","none"]},"play":{"editor":"enum","default":"yes","options":["yes","no"]},"variant":{"editor":"enum","default":"no","options":["no","yes"]},"pending":{"editor":"number","default":1},"nestable":{"editor":"enum","default":"yes","options":["yes","no"]},"member":{"editor":"enum","default":"no","options":["no","yes"]},"":{"width":240,"height":300}}'>
const ICONS = {
  copy: ['M10 8h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2z', 'M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2', ''],
  play: ['M6 3l14 9-14 9z', '', ''],
  comment: ['M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z', '', ''],
  variants: ['M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3', 'M16 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3', 'M12 2v20'],
  approve: ['M20 6 9 17l-5-5', '', ''],
  section: ['M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z', 'M3 9h18', ''],
  sub: ['M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z', 'M9 8h6a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z', ''],
  out: ['M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4', 'm16 17 5-5-5-5', 'M21 12H9'],
  rename: ['M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z', '', ''],
  open: 'M7 7h10v10M7 17 17 7',
  external: 'M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6',
  link: 'M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71',
  icon: 'M13.267 2.08a10 10 0 108.653 8.653M15 10V9M16 5h6M16.472 15a6 6 0 01-8.943 0M19 2v6M9 10V9',
  move: 'M2 9V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H20a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-1M2 13h10M9 16l3-3-3-3',
  sparkles: 'M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594zM20 2v4M22 4h-4M2 20a2 2 0 1 0 4 0a2 2 0 1 0 -4 0',
  select: 'M5 3a2 2 0 0 0-2 2M19 3a2 2 0 0 1 2 2M21 19a2 2 0 0 1-2 2M5 21a2 2 0 0 1-2-2M9 3h1M9 21h1M14 3h1M14 21h1M3 9v1M21 9v1M3 14v1M21 14v1',
  fit: 'M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3',
  hundred: 'M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2',
  hide: 'M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2zM9 3v18',
  grid: 'M4 3h5a1 1 0 0 1 1 1v5a1 1 0 0 1 -1 1h-5a1 1 0 0 1 -1 -1v-5a1 1 0 0 1 1 -1zM15 3h5a1 1 0 0 1 1 1v5a1 1 0 0 1 -1 1h-5a1 1 0 0 1 -1 -1v-5a1 1 0 0 1 1 -1zM15 14h5a1 1 0 0 1 1 1v5a1 1 0 0 1 -1 1h-5a1 1 0 0 1 -1 -1v-5a1 1 0 0 1 1 -1zM4 14h5a1 1 0 0 1 1 1v5a1 1 0 0 1 -1 1h-5a1 1 0 0 1 -1 -1v-5a1 1 0 0 1 1 -1z',
  locate: 'M2 12L5 12M19 12L22 12M12 2L12 5M12 19L12 22M5 12a7 7 0 1 0 14 0a7 7 0 1 0 -14 0M9 12a3 3 0 1 0 6 0a3 3 0 1 0 -6 0',
  tidy: 'M4 3h5a1 1 0 0 1 1 1v7a1 1 0 0 1 -1 1h-5a1 1 0 0 1 -1 -1v-7a1 1 0 0 1 1 -1zM15 3h5a1 1 0 0 1 1 1v3a1 1 0 0 1 -1 1h-5a1 1 0 0 1 -1 -1v-3a1 1 0 0 1 1 -1zM15 12h5a1 1 0 0 1 1 1v7a1 1 0 0 1 -1 1h-5a1 1 0 0 1 -1 -1v-7a1 1 0 0 1 1 -1zM4 16h5a1 1 0 0 1 1 1v3a1 1 0 0 1 -1 1h-5a1 1 0 0 1 -1 -1v-3a1 1 0 0 1 1 -1z',
  row: 'M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2zM9 3v18M15 3v18',
  column: 'M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2zM21 9H3M21 15H3',
  wrap: 'M16 16l-3 3 3 3M3 12h14.5a1 1 0 0 1 0 7H13M3 19h6M3 5h18',
  grid: 'M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2zM3 9h18M3 15h18M9 3v18M15 3v18',
  trash: ['M3 6h18', 'M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6', 'M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2'],
}
class Component extends DCLogic {
  renderVals() {
    const { theme, target, session, play, variant, nestable, sidebar, submenu, member } = this.props
    const count = Number(this.props.count)
    const connected = session !== 'none'
    const single = target === 'frame'
    const page = target === 'page' || target === 'canvas'
    const item = (icon, label, extra = {}) => {
      const found = ICONS[icon]
      const [d1, d2, d3] = Array.isArray(found) ? found : [found, '', '']
      const danger = extra.danger === true
      return { id: extra.id || '', d1, d2, d3, label, key: extra.key || '', sub: extra.sub === true, bg: 'transparent', op: extra.off === true ? 0.5 : 1, color: danger ? 'var(--destructive)' : 'var(--foreground)', iconColor: danger ? 'var(--destructive)' : 'var(--muted-foreground)', flyout: extra.flyout || [], flyoutLabel: extra.flyoutLabel || '' }
    }
    const frameNames = single ? 'Copy frame name' : `Copy ${count} frame names`
    const sectionFlyout = {
      frame: [member === 'yes' ? item('out', 'Remove from section') : item('section', 'Create section', { key: 'Shift+S' })],
      frames: [member === 'yes' ? item('out', 'Remove from section') : item('section', 'Create section', { key: 'Shift+S' })],
      part: [nestable === 'yes' ? item('sub', 'Create sub-section') : null, item('out', 'Remove from section')],
      mixed: [item('section', 'Create section', { key: 'Shift+S' }), item('out', 'Remove from section')],
      section: [nestable === 'yes' ? item('sub', 'Create sub-section') : null, item('rename', 'Rename section'), item('trash', 'Delete section', { danger: true })],
    }[target] || []
    const copyFlyout = [item('copy', target === 'section' ? 'Copy section name' : frameNames)]
    const sectionParent = item('section', 'Section', { sub: true, id: 'section', flyout: sectionFlyout, flyoutLabel: 'Section' })
    const copyParent = item('copy', 'Copy', { sub: true, id: 'copy', flyout: copyFlyout, flyoutLabel: 'Copy' })
    const ask = item('sparkles', 'Ask the agent…', { off: !connected })
    let pageGroups = null
    if (page) {
      const pageParent = item('rename', 'Page', { sub: true, id: 'page', flyout: [item('rename', 'Rename page'), item('icon', 'Change icon…'), item('copy', 'Copy page name'), item('link', 'Copy page link')], flyoutLabel: 'Page' })
      const viewParent = item('fit', 'View', { sub: true, id: 'view', flyout: [item('select', 'Select all', { key: 'Ctrl+A' }), item('fit', 'Zoom to fit', { key: 'Shift+1' }), item('hundred', 'Zoom to 100%', { key: 'Shift+0' }), item('hide', 'Hide sidebar', { key: 'Ctrl+\\' })], flyoutLabel: 'View' })
      pageGroups = [
        [ask, item('grid', 'Reorganize frames with agent', { off: !connected }), item('sparkles', 'Choose icon with agent', { off: !connected })],
        [pageParent, viewParent],
      ]
    }
    const locate = sidebar === 'yes' && (target === 'frame' || target === 'section') ? [item('locate', 'Show on canvas')] : []
    const body = {
      frame: [
        [ask, connected && variant === 'no' ? item('variants', 'Generate variants…') : null],
        [play === 'yes' ? item('play', 'Play') : null, item('comment', 'Comment')],
        [sectionParent, copyParent],
      ],
      frames: [[ask], [sectionParent, copyParent]],
      part: [[ask], [sectionParent, copyParent]],
      mixed: [[ask], [sectionParent, copyParent]],
      section: [
        [ask, item('grid', 'Reorganize with agent', { off: !connected })],
        [item('tidy', 'Arrange…'), sectionParent, copyParent],
      ],
    }[target]
    const groups = (pageGroups || [locate, ...body])
      .map((items) => items.filter(Boolean))
      .filter((items) => items.length > 0)
      .map((items, i) => ({ sep: i > 0, items }))
    let parent = null
    let subTop = 0
    let y = 7
    for (const g of groups) {
      if (g.sep) y += 13
      for (const it of g.items) {
        if (it.sub && it.id === submenu) {
          parent = it
          subTop = y - 7
        }
        y += 38
      }
    }
    const showSub = parent !== null
    if (showSub) parent.bg = 'var(--accent)'
    else groups[0].items[0].bg = 'var(--accent)'
    const subItems = showSub ? parent.flyout.filter(Boolean) : []
    return {
      themeClass: theme === 'dark' ? 'dark' : '',
      label: target === 'page' ? 'Page actions' : target === 'canvas' ? 'Canvas actions' : single ? 'Frame actions' : 'Selection actions',
      width: page ? 268 : 240,
      showSub,
      subTop,
      subLabel: showSub ? parent.flyoutLabel : '',
      subItems,
      groups,
    }
  }
}
</script>
</body>
</html>
