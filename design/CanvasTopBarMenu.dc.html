<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Top bar: approve menu open</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<dc-import name="CanvasTopBar" sessions="one" pending="3" menu="open" sidebar="shown" theme="{{theme}}" hint-size="1440px,220px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"light","options":["light","dark"]},"$preview":{"width":1440,"height":220}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme }
  }
}
</script>
</body>
</html>
