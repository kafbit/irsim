<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>irsim canvas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div style="display: flex; flex-direction: column; width: 100%; height: 100%; background: #F6F6F3; font-family: system-ui, sans-serif; color: #14161A;">
<div style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px; background: #FFFFFF; border-bottom: 1px solid #E3E3DE;">
<strong style="font-size: 14px;">{{title}}</strong>
<span style="font-size: 12px; color: #6B7079;">{{count}} boards</span>
</div>
<div style="display: flex; flex: 1; min-height: 0;">
<div style="width: 220px; padding: 12px; background: #FFFFFF; border-right: 1px solid #E3E3DE; font-size: 13px;">
<sc-for list="{{pages}}" as="page"><div style="padding: 6px 8px; border-radius: 6px;">{{page}}</div></sc-for>
</div>
<div style="flex: 1; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #6B7079;">Canvas area</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"irsim"},"$preview":{"width":960,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    const pages = ['Home', 'Components'];
    return { title: this.props.title, pages, count: pages.length };
  }
}
</script>
</body>
</html>
