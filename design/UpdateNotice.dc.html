<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Update notice</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.un-root{--pick:#14161a;--card:#ffffff;--fg:#14161a;--muted:#5a606b;--secondary:#f4f4f2;--border:#e4e4e0;--primary:#14161a;--primary-fg:#ffffff;--info:#e8f0fb;--info-fg:#1e4e8c;--danger:#9a2a1a;--shell:#efefed}
.un-root.dark{--pick:#14161a;--card:#1a1b1e;--fg:#ecece8;--muted:#a3a7ae;--secondary:#26272b;--border:#2d2e33;--primary:#ecece8;--primary-fg:#14161a;--info:#14263e;--info-fg:#93bcf0;--danger:#ff8f80;--shell:#0b0c0d}
.un-spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--info-fg);animation:un-spin 0.8s linear infinite;flex-shrink:0}
@keyframes un-spin{to{transform:rotate(360deg)}}
</style>
</helmet>
<div dir="ltr" lang="en" class="un-root {{themeClass}}" style="display: flex; width: 100%; min-height: 100vh; background: var(--shell); font-family: system-ui, sans-serif; color: var(--fg); font-size: 14px;">
<aside style="display: flex; flex-direction: column; gap: 12px; width: 288px; box-sizing: border-box; padding: 12px; background: var(--card); border-right: 1px solid var(--border);">
<nav style="display: flex; flex-direction: column;">
<div style="padding: 6px 8px; border-radius: 8px; color: var(--muted);">All pages</div>
<sc-for list="{{pages}}" as="page"><div style="display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; background: {{page.bg}}; font-weight: {{page.weight}};"><span style="flex: 1;">{{page.title}}</span><span style="font-size: 12px; color: var(--muted);">{{page.count}}</span></div></sc-for>
</nav>
<div style="height: 34px; box-sizing: border-box; padding: 0 10px; display: flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font-size: 13px;">Search boards</div>
<p style="margin: 0; font-size: 12px; color: var(--muted);">4 boards</p>
<div style="display: flex; flex-direction: column; flex: 1; min-height: 0; margin: 0 -4px;">
<sc-for list="{{boards}}" as="board"><div style="padding: 6px 8px; border-radius: 8px;">{{board}}</div></sc-for>
</div>
<section aria-label="irsim update" style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--card);">
<div style="display: flex; align-items: flex-start; gap: 8px;">
<div style="flex: 1; min-width: 0;">
<div style="font-weight: 600; font-size: 13px;">{{headline}}</div>
<div style="margin-top: 2px; font-size: 12px; color: {{detailColor}};">{{detail}}</div>
</div>
<sc-if value="{{dismissable}}" hint-placeholder-val="{{true}}">
<button type="button" aria-label="Dismiss" style="width: 24px; height: 24px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 16px; line-height: 1; cursor: pointer;">×</button>
</sc-if>
</div>
<sc-if value="{{downloading}}" hint-placeholder-val="{{false}}">
<div role="progressbar" aria-label="{{busyLabel}}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{percent}}" style="display: flex; flex-direction: column; gap: 6px;">
<div style="display: flex; align-items: baseline; gap: 8px; font-size: 12px;"><span style="flex: 1; min-width: 0; color: var(--info-fg);">{{busyLabel}}</span><span style="font-weight: 600; font-variant-numeric: tabular-nums;">{{percent}}%</span></div>
<div style="height: 6px; border-radius: 9999px; background: var(--secondary); overflow: hidden;"><div style="width: {{percent}}%; height: 100%; border-radius: 9999px; background: var(--info-fg);"></div></div>
<div style="font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;">{{bytes}}</div>
</div>
</sc-if>
<sc-if value="{{spinning}}" hint-placeholder-val="{{false}}">
<div role="status" style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--info-fg);"><span class="un-spin"></span><span>{{busyLabel}}</span></div>
</sc-if>
<sc-if value="{{hasAction}}" hint-placeholder-val="{{true}}">
<div style="display: flex; align-items: center; gap: 8px;">
<button type="button" style="height: 34px; padding: 0 12px; border: 1px solid var(--primary); border-radius: 8px; background: var(--primary); color: var(--primary-fg); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;">{{action}}</button>
<sc-if value="{{hasNotes}}" hint-placeholder-val="{{true}}">
<a href="#" style="font-size: 12px; color: var(--muted);">Release notes</a>
</sc-if>
</div>
</sc-if>
<sc-if value="{{failed}}" hint-placeholder-val="{{false}}">
<div style="font-size: 12px; color: var(--muted);">{{hint}}</div>
<div style="display: flex; align-items: center; gap: 8px;">
<code style="flex: 1; padding: 6px 8px; border-radius: 6px; background: var(--secondary); font-size: 12px;">irsim update</code>
<button type="button" style="height: 30px; padding: 0 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--fg); font: inherit; font-size: 12px; cursor: pointer;">Copy</button>
</div>
</sc-if>
</section>
</aside>
<div style="flex: 1; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--muted);">Canvas</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","default":"available","options":["available","restart","rebuild","updating","installing","restarting","failed","notback"]},"theme":{"editor":"enum","default":"light","options":["light","dark"]},"$preview":{"width":720,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const state = this.props.state
    const latest = '0.1.4'
    const running = '0.1.3'
    const copy = {
      available: { headline: `irsim ${latest} is available`, detail: `You have ${running}.`, action: 'Update and restart' },
      restart: { headline: `irsim ${latest} is installed`, detail: `This canvas still runs ${running}. Restart it to use ${latest}.`, action: 'Restart' },
      rebuild: { headline: `A new build of irsim ${latest} is installed`, detail: 'This canvas still runs the previous build. Restart it to use the new one.', action: 'Restart' },
      updating: { headline: `Updating to ${latest}`, detail: 'The canvas restarts when the download is installed.', busyLabel: `Downloading ${latest}…` },
      installing: { headline: `Updating to ${latest}`, detail: 'The canvas restarts when the download is installed.', busyLabel: `Installing ${latest}…` },
      restarting: { headline: `Restarting on ${latest}`, detail: 'The page reloads when the canvas answers.', busyLabel: 'Restarting the canvas…' },
      failed: { headline: 'The update failed', detail: 'gh release download failed: HTTP 401', hint: 'Run the update in a terminal:' },
      notback: { headline: 'The update failed', detail: 'The canvas did not come back. Run irsim serve in the project.' },
    }[state]
    const pages = [
      { title: 'Home', count: 1, bg: 'var(--secondary)', weight: 500 },
      { title: 'Components', count: 3, bg: 'transparent', weight: 400 },
    ]
    return {
      ...copy,
      themeClass: this.props.theme === 'dark' ? 'dark' : '',
      pages,
      boards: ['Home', 'Button', 'Dialog', 'Table'],
      dismissable: state === 'available' || state === 'restart' || state === 'rebuild' || state === 'failed' || state === 'notback',
      downloading: state === 'updating',
      spinning: state === 'installing' || state === 'restarting',
      percent: 42,
      bytes: '4.2 MB of 10.0 MB',
      hasAction: state === 'available' || state === 'restart' || state === 'rebuild',
      hasNotes: state === 'available',
      failed: state === 'failed',
      detailColor: state === 'failed' || state === 'notback' ? 'var(--danger)' : 'var(--muted)',
    }
  }
}
</script>
</body>
</html>
