<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"light","options":["light","dark"]},"state":{"editor":"enum","default":"one","options":["one","several","several-open","pick","none"]},"size":{"editor":"enum","default":"regular","options":["regular","compact"]},"agent":{"editor":"enum","default":"claude-code","options":["claude-code", "codex", "opencode", "pi", "command-code", "other"]},"$preview":{"width":288,"height":260}}'>
class Component extends DCLogic {
  renderVals() {
    const { theme, state } = this.props
    const compact = this.props.size === 'compact'
    const agent = this.props.agent || 'claude-code'
    const flags = (id) => ({ isClaude: id === 'claude-code', isCodex: id === 'codex', isOpencode: id === 'opencode', isPi: id === 'pi', isCommand: id === 'command-code', isOther: id === 'other' })
    const several = state === 'several' || state === 'several-open' || state === 'pick'
    const open = state === 'several-open'
    const sessions = [
      { title: 'Frame sections and variant selection', branch: 'feat/sections-variants', selected: 'true', bg: 'var(--accent)', check: '✓', ...flags('claude-code') },
      { title: 'Doctor and settings page', branch: 'feat/doctor-settings', selected: 'false', bg: 'transparent', check: '', ...flags('codex') },
      { title: 'Install flags', branch: 'feat/install-flags', selected: 'false', bg: 'transparent', check: '', ...flags('opencode') },
    ]
    return {
      themeClass: theme === 'dark' ? 'dark' : '',
      pad: open ? '176px 16px 16px' : '16px',
      cur: flags(agent),
      showLogo: state !== 'pick',
      noLogo: state === 'pick',
            hasSession: state !== 'none',
      noSession: state === 'none',
      several,
      menuOpen: open,
      popup: several ? 'listbox' : 'false',
      open: open ? 'true' : 'false',
      cursor: several ? 'pointer' : 'default',
      picked: state !== 'pick',
      twoLine: state !== 'pick' && !compact,
      regular: !compact,
      rowPad: compact ? '5px 10px' : '8px 10px',
      radius: compact ? '8px' : '10px',
      title: state === 'pick' ? 'Pick a session' : sessions[0].title,
      branch: sessions[0].branch,
      sessions,
    }
  }
}
</script>
