<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Canvas frame</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.cf-root{--pick:#14161a;--background:#ffffff;--foreground:#14161a;--card:#ffffff;--secondary:#f4f4f2;--muted-foreground:#5a606b;--accent:#f4f4f2;--border:#e4e4e0;--border-strong:#d6d7d2;--primary:#14161a;--primary-foreground:#ffffff;--destructive:#9a2a1a;--destructive-tint:#fbe9e6;--success:#e3f1e8;--success-foreground:#1b6b3a;--warning:#fdf0e2;--warning-foreground:#8a4a0b;--info:#e8f0fb;--info-foreground:#1e4e8c;--highlight:#f2a33a;--shell:#efefed;--surface:#fafaf8;--input:#8a8f98;--ring:#14161a;--play:#2563eb;--play-hover:#1d4ed8;--mock-bg:#f6f6f3;--mock-ink:#14161a;--mock-on-ink:#ecece8;--mock-card:#ffffff;--mock-line:#e4e4e0;--mock-bar:#d6d7d2;--mock-accent:#2563eb}
.cf-root.dark{--pick:#14161a;--background:#111214;--foreground:#ecece8;--card:#1a1b1e;--secondary:#26272b;--muted-foreground:#a3a7ae;--accent:#26272b;--border:#2d2e33;--border-strong:#3b3c42;--primary:#ecece8;--primary-foreground:#14161a;--destructive:#ff8f80;--destructive-tint:#3b1814;--success:#15301f;--success-foreground:#86d6a6;--warning:#3b2a14;--warning-foreground:#f3b66f;--info:#14263e;--info-foreground:#93bcf0;--highlight:#f2a33a;--shell:#0b0c0d;--surface:#121315;--input:#666b74;--ring:#ecece8;--play:#60a5fa;--play-hover:#93c5fd}
.cf-pulse{animation:cf-pulse 2s cubic-bezier(0.4,0,0.6,1) infinite}
@keyframes cf-pulse{50%{opacity:0.5}}
</style>
</helmet>
<div dir="ltr" lang="en" class="cf-root {{themeClass}}" style="position: relative; box-sizing: border-box; width: 100%; min-height: var(--cv-h, 100vh); padding: 48px 20px 20px 20px; background: var(--cv-bg, var(--shell)); font-family: system-ui, sans-serif; color: var(--foreground); font-size: 14px;">
<div data-board="Dialog" style="position: relative; width: {{boxWidth}}; height: {{boxHeight}};">
<button type="button" style="position: absolute; left: 0; bottom: 100%; display: flex; align-items: baseline; gap: 8px; max-width: {{titleMax}}; box-sizing: border-box; margin: 0; padding: 0 0 6px 0; border: 0; background: transparent; overflow: hidden; font: inherit; font-size: 12px; line-height: 16px; white-space: nowrap; text-align: start; color: var(--foreground); cursor: {{titleCursor}};">
<sc-if value="{{isPrototype}}" hint-placeholder-val="{{false}}">
<span role="img" aria-label="Prototype" style="flex-shrink: 0; align-self: center; width: 8px; height: 8px; border-radius: 50%; background: #2563eb;"></span>
</sc-if>
<sc-for list="{{statuses}}" as="status">
<sc-if value="{{compact}}" hint-placeholder-val="{{false}}"><span role="img" aria-label="{{status.label}}" title="{{status.label}}" style="flex-shrink: 0; align-self: center; width: 8px; height: 8px; border-radius: 50%; background: {{status.color}};"></span></sc-if>
<sc-if value="{{wordy}}" hint-placeholder-val="{{true}}"><span style="flex-shrink: 0; font-weight: 500; color: {{status.color}};">{{status.label}}</span></sc-if>
</sc-for>
<span dir="auto" style="min-width: 0; overflow: hidden; text-overflow: ellipsis; font-weight: 500;">Confirmation dialog</span>
<span style="min-width: 0; flex-shrink: 10000; overflow: hidden; text-overflow: ellipsis; color: var(--muted-foreground);">Dialog</span>
</button>
<sc-if value="{{showPlay}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; right: 0; bottom: 100%; display: flex; align-items: center; padding-bottom: 4px;">
<button type="button" aria-label="Play prototype Confirmation dialog" style="display: inline-flex; align-items: center; justify-content: center; gap: 4px; height: 24px; box-sizing: border-box; margin: 0; padding: {{playPadding}}; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--play); font: inherit; font-size: 12px; font-weight: 500; white-space: nowrap; cursor: pointer;">
<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
<sc-if value="{{wordy}}" hint-placeholder-val="{{true}}"><span>Play</span></sc-if>
</button>
</div>
</sc-if>
<sc-if value="{{showStop}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; right: 0; bottom: 100%; display: flex; align-items: center; padding-bottom: 4px;">
<button type="button" aria-label="Stop playing Confirmation dialog" style="display: inline-flex; align-items: center; justify-content: center; gap: 4px; height: 24px; box-sizing: border-box; margin: 0; padding: 0 8px; border: 1px solid #2563eb; border-radius: 8px; background: #2563eb; color: #ffffff; font: inherit; font-size: 12px; font-weight: 500; white-space: nowrap; cursor: pointer;">Stop</button>
</div>
</sc-if>
<div style="position: relative; width: 100%; height: 100%; box-sizing: border-box; overflow: hidden; border-radius: 12px; background: #ffffff; outline: {{outline}};">
<sc-if value="{{showMock}}" hint-placeholder-val="{{true}}">
<div style="position: absolute; inset: 0; overflow: hidden; background: var(--mock-bg); filter: {{mockFilter}};">
<div style="position: absolute; left: 0; right: 0; top: 0; height: 16%; background: var(--mock-ink);">
<div style="position: absolute; left: 5%; top: 30%; width: 9%; height: 40%; border-radius: 3px; background: var(--mock-on-ink);"></div>
<div style="position: absolute; right: 5%; top: 40%; width: 8%; height: 20%; border-radius: 2px; background: var(--mock-bar);"></div>
<div style="position: absolute; right: 16%; top: 40%; width: 8%; height: 20%; border-radius: 2px; background: var(--mock-bar);"></div>
</div>
<div style="position: absolute; left: 5%; top: 24%; width: 42%; height: 44%; box-sizing: border-box; border: 1px solid var(--mock-line); border-radius: 6px; background: var(--mock-card);">
<div style="position: absolute; left: 10%; top: 12%; width: 55%; height: 10%; border-radius: 2px; background: var(--mock-ink);"></div>
<div style="position: absolute; left: 10%; top: 34%; width: 80%; height: 6%; border-radius: 2px; background: var(--mock-bar);"></div>
<div style="position: absolute; left: 10%; top: 48%; width: 70%; height: 6%; border-radius: 2px; background: var(--mock-bar);"></div>
<div style="position: absolute; left: 10%; top: 62%; width: 50%; height: 6%; border-radius: 2px; background: var(--mock-bar);"></div>
</div>
<div style="position: absolute; left: 53%; top: 24%; width: 42%; height: 44%; box-sizing: border-box; border: 1px solid var(--mock-line); border-radius: 6px; background: var(--mock-card);">
<div style="position: absolute; left: 10%; top: 12%; width: 45%; height: 10%; border-radius: 2px; background: var(--mock-ink);"></div>
<div style="position: absolute; left: 10%; top: 34%; width: 80%; height: 6%; border-radius: 2px; background: var(--mock-bar);"></div>
<div style="position: absolute; left: 10%; top: 48%; width: 60%; height: 6%; border-radius: 2px; background: var(--mock-bar);"></div>
<div style="position: absolute; left: 10%; top: 62%; width: 72%; height: 6%; border-radius: 2px; background: var(--mock-bar);"></div>
</div>
<div style="position: absolute; left: 5%; top: 76%; width: 24%; height: 12%; border-radius: 6px; background: var(--mock-accent);"></div>
</div>
</sc-if>
<sc-if value="{{showPlaceholder}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 30px; line-height: 36px; color: var(--muted-foreground);">
<div class="{{fillClass}}" style="position: absolute; inset: 0; background: var(--secondary);"></div>
<span style="position: relative;">Dialog</span>
</div>
</sc-if>
</div>
<sc-if value="{{selected}}" hint-placeholder-val="{{false}}">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; outline: 2px solid var(--ring); pointer-events: none;">
<sc-if value="{{handlesShown}}" hint-placeholder-val="{{true}}"><sc-for list="{{handles}}" as="handle"><span style="position: absolute; left: {{handle.left}}; top: {{handle.top}}; width: 8px; height: 8px; box-sizing: border-box; border: 1px solid var(--ring); background: #ffffff; transform: translate(-50%, -50%);"></span></sc-for></sc-if>
</div>
</sc-if>
<sc-if value="{{titleHover}}" hint-placeholder-val="{{false}}">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; border-radius: 12px; outline: 2px solid var(--pick); outline-offset: -2px; pointer-events: none;"></div>
</sc-if>
<sc-if value="{{wholeComposing}}" hint-placeholder-val="{{false}}">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; outline: 2px solid var(--pick); outline-offset: -2px; pointer-events: none;"></div>
</sc-if>
<sc-if value="{{commenting}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 0; top: 0; pointer-events: none;">
<div data-pin="" aria-label="Comment 1" style="position: absolute; left: {{pinOneLeft}}; top: {{pinOneTop}}; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--primary); color: var(--primary-foreground); font-size: 12px; font-weight: 600; transform: translate(-50%, -50%);">1<span aria-hidden="true" style="position: absolute; right: -2px; top: -2px; width: 8px; height: 8px; border-radius: 50%; background: var(--highlight);"></span></div>
<div data-pin="" aria-label="Comment 2" style="position: absolute; left: {{pinTwoLeft}}; top: {{pinTwoTop}}; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--muted-foreground); color: var(--primary-foreground); font-size: 12px; font-weight: 600; transform: translate(-50%, -50%);">2</div>
<sc-if value="{{wholePin}}" hint-placeholder-val="{{false}}">
<div data-pin="" aria-label="Comment 3" style="position: absolute; left: {{pinWholeLeft}}; top: 20px; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--muted-foreground); color: var(--primary-foreground); font-size: 12px; font-weight: 600; transform: translate(-50%, -50%);">3</div>
</sc-if>
</div>
</sc-if>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 130px; top: 24px; z-index: 2;"><dc-import name="CanvasContextMenu" target="frame" session="{{session}}" play="{{playable}}" variant="{{variantFlag}}" pending="{{pendingCount}}" theme="{{theme}}" hint-size="240px,260px"></dc-import></div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"light","options":["light","dark"]},"state":{"editor":"enum","default":"live","options":["live","selected","thumbnail","selectedMany","stale","generating","pending","failed","playing","commenting"]},"prototype":{"editor":"enum","default":"no","options":["no","yes"]},"hover":{"editor":"enum","default":"none","options":["none","title"]},"whole":{"editor":"enum","default":"none","options":["none","pin","composing"]},"approval":{"editor":"enum","default":"none","options":["none","approved","changed","new"]},"menu":{"editor":"enum","default":"closed","options":["closed","open"]},"session":{"editor":"enum","default":"one","options":["one","none"]},"width":{"editor":"number","default":360},"height":{"editor":"number","default":240},"$preview":{"width":400,"height":308}}'>
class Component extends DCLogic {
  renderVals() {
    const { state, prototype, approval, theme, hover, whole, menu, session } = this.props
    const width = Number(this.props.width)
    const height = Number(this.props.height)
    const playing = state === 'playing'
    const placeholder = state === 'pending' || state === 'failed'
    const statuses = [
      state === 'stale' ? { label: 'Outdated', color: 'var(--warning-foreground)' } : null,
      state === 'generating' ? { label: 'Not changed yet', color: 'var(--muted-foreground)' } : null,
      approval === 'approved' ? { label: 'Approved', color: 'var(--success-foreground)' } : null,
      approval === 'changed' ? { label: 'Changed', color: 'var(--warning-foreground)' } : null,
      approval === 'new' ? { label: 'New', color: 'var(--info-foreground)' } : null,
    ].filter(Boolean)
    const compact = width < 200
    return {
      statuses,
      menuOpen: menu === 'open',
      session: session === 'none' ? 'none' : 'one',
      playable: prototype === "yes" ? "yes" : "no",
      variantFlag: state === 'generating' ? 'yes' : 'no',
      pendingCount: approval === 'new' || approval === 'changed' ? 1 : 0,
      theme: theme === 'dark' ? 'dark' : 'light',
      compact,
      wordy: !compact,
      playPadding: compact ? '0 6px' : '0 8px 0 6px',
      titleMax: compact && prototype === 'yes' && !playing ? 'calc(100% - 32px)' : '100%',
      themeClass: theme === 'dark' ? 'dark' : '',
      boxWidth: `${width}px`,
      boxHeight: `${height}px`,
      isPrototype: prototype === 'yes',
      approved: approval === 'approved',
      changed: approval === 'changed',
      isNew: approval === 'new',
      showPlay: prototype === 'yes' && !playing,
      showStop: playing,
      outline: playing ? '2px solid #2563eb' : '1px solid var(--border)',
      showMock: !placeholder,
      showPlaceholder: placeholder,
      mockFilter: state === 'thumbnail' || state === 'stale' ? 'saturate(0.9)' : 'none',
      stale: state === 'stale',
      generating: state === 'generating',
      fillClass: state === 'pending' ? 'cf-pulse' : '',
      selected: state === 'selected' || state === 'selectedMany',
      handlesShown: state === 'selected',
      commenting: state === 'commenting',
      titleCursor: state === 'commenting' ? 'crosshair' : 'pointer',
      titleHover: state === 'commenting' && hover === 'title',
      wholePin: state === 'commenting' && whole === 'pin',
      wholeComposing: state === 'commenting' && whole === 'composing',
      pinWholeLeft: `${width - 20}px`,
      handles: [
        { left: '0%', top: '0%' },
        { left: '50%', top: '0%' },
        { left: '100%', top: '0%' },
        { left: '100%', top: '50%' },
        { left: '100%', top: '100%' },
        { left: '50%', top: '100%' },
        { left: '0%', top: '100%' },
        { left: '0%', top: '50%' },
      ],
      pinOneLeft: `${Math.round(width * 0.47)}px`,
      pinOneTop: `${Math.round(height * 0.24)}px`,
      pinTwoLeft: `${Math.round(width * 0.95)}px`,
      pinTwoTop: `${Math.round(height * 0.48)}px`,
    }
  }
}
</script>
</body>
</html>
