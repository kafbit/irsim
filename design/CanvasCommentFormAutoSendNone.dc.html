<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Comment form: send to the agent, no session</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<dc-import name="CanvasCommentForm" mode="comment" session="none" send="on" theme="{{theme}}" hint-size="368px,400px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"light","options":["light","dark"]},"$preview":{"width":368,"height":400}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme }
  }
}
</script>
</body>
</html>
