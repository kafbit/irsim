<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Frame: zoomed out further, one dot and no Play</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<dc-import name="CanvasFrame" state="live" approval="changed" prototype="yes" width="100" height="70" theme="{{theme}}" hint-size="200px,178px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"light","options":["light","dark"]},"$preview":{"width":160,"height":138}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme }
  }
}
</script>
</body>
</html>
