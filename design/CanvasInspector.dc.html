<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Canvas inspector</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.cv-root{--pick:#14161a;--background:#ffffff;--foreground:#14161a;--card:#ffffff;--secondary:#f4f4f2;--muted:#efefeb;--muted-foreground:#5a606b;--accent:#f4f4f2;--border:#e4e4e0;--border-strong:#d6d7d2;--primary:#14161a;--primary-foreground:#ffffff;--destructive:#9a2a1a;--destructive-tint:#fbe9e6;--rented:#f1ecfa;--rented-foreground:#4f2d8a;--success:#e3f1e8;--success-foreground:#1b6b3a;--warning:#fdf0e2;--warning-foreground:#8a4a0b;--info:#e8f0fb;--info-foreground:#1e4e8c;--highlight:#f2a33a;--shell:#efefed;--surface:#fafaf8;--input:#8a8f98;--ring:#14161a}
.cv-root.dark{--pick:#14161a;--background:#111214;--foreground:#ecece8;--card:#1a1b1e;--secondary:#26272b;--muted:#26272b;--muted-foreground:#a3a7ae;--accent:#26272b;--border:#2d2e33;--border-strong:#3b3c42;--primary:#ecece8;--primary-foreground:#14161a;--destructive:#ff8f80;--destructive-tint:#3b1814;--rented:#281f3b;--rented-foreground:#bda7ec;--success:#15301f;--success-foreground:#86d6a6;--warning:#3b2a14;--warning-foreground:#f3b66f;--info:#14263e;--info-foreground:#93bcf0;--highlight:#f2a33a;--shell:#0b0c0d;--surface:#121315;--input:#666b74;--ring:#ecece8}
</style>
</helmet>
<div dir="ltr" lang="en" class="cv-root {{themeClass}}" style="display: flex; width: 100%; min-height: 100vh; background: var(--card); font-family: system-ui, sans-serif; color: var(--foreground); font-size: 14px;">
<aside aria-label="Inspector" style="display: flex; flex-direction: column; gap: 16px; width: 288px; flex-shrink: 0; box-sizing: border-box; min-height: 100vh; padding: 16px; background: var(--card); border-right: 1px solid var(--border);">
<header style="display: flex; flex-direction: column; gap: 4px;">
<h2 style="margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 16px; line-height: 24px; font-weight: 600;">{{title}}</h2>
<p style="margin: 0; font-size: 14px; color: var(--muted-foreground);">{{subtitle}}</p>
</header>
<sc-if value="{{isMulti}}" hint-placeholder-val="{{false}}">
<section aria-label="Section actions" style="position: relative; display: flex; align-items: center; gap: 8px;">
<button type="button" aria-haspopup="menu" aria-expanded="{{menuOpen}}" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--background); color: var(--foreground); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;">Section<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="m6 9 6 6 6-6"></path></svg></button>
<button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--background); color: var(--foreground); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;">Arrange...</button>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
<div role="menu" aria-label="Section" style="position: absolute; left: 0; top: 100%; margin-top: 4px; z-index: 10; display: flex; flex-direction: column; gap: 2px; box-sizing: border-box; width: 240px; padding: 4px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); box-shadow: 0 8px 24px rgba(0,0,0,0.16);">
<sc-if value="{{notShared}}" hint-placeholder-val="{{false}}"><button type="button" role="menuitem" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 32px; box-sizing: border-box; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: var(--foreground); font: inherit; font-size: 13px; text-align: left; cursor: pointer;"><span>Create section</span><span style="padding: 1px 6px; border: 1px solid var(--border-strong); border-radius: 6px; font-size: 11px; color: var(--muted-foreground);">Shift+S</span></button></sc-if>
<button type="button" role="menuitem" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 32px; box-sizing: border-box; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: var(--foreground); font: inherit; font-size: 13px; text-align: left; cursor: pointer;">Remove from section</button>
<sc-if value="{{showDelete}}" hint-placeholder-val="{{false}}">
<button type="button" role="menuitem" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 32px; box-sizing: border-box; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: var(--foreground); font: inherit; font-size: 13px; text-align: left; cursor: pointer;">Create sub-section</button>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 32px; padding: 0 8px;"><span style="font-size: 13px;">Color</span><div style="display: flex; align-items: center; gap: 8px; padding: 2px;"><button type="button" aria-label="Gray" aria-pressed="true" style="width: 20px; height: 20px; box-sizing: border-box; margin: 0; padding: 0; border: 1px solid var(--border-strong); border-radius: 50%; background: var(--muted-foreground); outline: 2px solid var(--ring); outline-offset: 2px; cursor: pointer;"></button><button type="button" aria-label="Blue" aria-pressed="false" style="width: 20px; height: 20px; box-sizing: border-box; margin: 0; padding: 0; border: 1px solid var(--border-strong); border-radius: 50%; background: var(--info-foreground); cursor: pointer;"></button><button type="button" aria-label="Green" aria-pressed="false" style="width: 20px; height: 20px; box-sizing: border-box; margin: 0; padding: 0; border: 1px solid var(--border-strong); border-radius: 50%; background: var(--success-foreground); cursor: pointer;"></button><button type="button" aria-label="Amber" aria-pressed="false" style="width: 20px; height: 20px; box-sizing: border-box; margin: 0; padding: 0; border: 1px solid var(--border-strong); border-radius: 50%; background: var(--warning-foreground); cursor: pointer;"></button><button type="button" aria-label="Purple" aria-pressed="false" style="width: 20px; height: 20px; box-sizing: border-box; margin: 0; padding: 0; border: 1px solid var(--border-strong); border-radius: 50%; background: var(--rented-foreground); cursor: pointer;"></button><button type="button" aria-label="Red" aria-pressed="false" style="width: 20px; height: 20px; box-sizing: border-box; margin: 0; padding: 0; border: 1px solid var(--border-strong); border-radius: 50%; background: var(--destructive); cursor: pointer;"></button></div></div>
<div role="separator" style="height: 1px; margin: 2px 0; background: var(--border);"></div>
<button type="button" role="menuitem" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 32px; box-sizing: border-box; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: var(--foreground); font: inherit; font-size: 13px; text-align: left; cursor: pointer; color: var(--destructive);">Delete section</button>
</sc-if>
</div>
</sc-if>
</section>
</sc-if>
<sc-if value="{{notMulti}}" hint-placeholder-val="{{true}}">
<sc-if value="{{showApproval}}" hint-placeholder-val="{{true}}">
<section aria-label="Approve" style="display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
<h3 style="margin: 0; font-size: 12px; font-weight: 400; color: var(--muted-foreground);">Approval</h3>
<sc-if value="{{hasBadge}}" hint-placeholder-val="{{true}}">
<span style="display: inline-flex; align-items: center; height: 20px; box-sizing: border-box; padding: 0 8px; border-radius: 9999px; background: {{badgeBg}}; color: {{badgeFg}}; font-size: 11px; font-weight: 600; white-space: nowrap;">{{badgeText}}</span>
</sc-if>
</div>
<sc-if value="{{showApprovalForm}}" hint-placeholder-val="{{true}}">
<div style="box-sizing: border-box; min-height: 64px; padding: 8px 10px; border: 1px solid var(--input); border-radius: 10px; font-size: 14px; color: var(--muted-foreground);">Note for the agent (optional)</div>
<button type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 12px 0 10px; border: 1px solid var(--primary); border-radius: 10px; background: var(--primary); color: var(--primary-foreground); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Approve and build</button>
<sc-if value="{{queued}}" hint-placeholder-val="{{false}}">
<p role="status" style="margin: 0; font-size: 12px; color: var(--muted-foreground);">Waiting for the agent to receive it.</p>
</sc-if>
</sc-if>
</section>
</sc-if>
<div style="--cv-h: 0px; --cv-pad: 0px; --cv-bg: transparent;"><dc-import name="CanvasComposer" narrow="yes" scope="board" target="{{boardName}}" theme="{{theme}}" hint-size="288px,150px"></dc-import></div>
<section aria-label="Details" style="display: flex; flex-direction: column; gap: 12px;">
<button type="button" aria-expanded="{{detailsExpanded}}" style="display: flex; align-items: center; gap: 6px; height: 32px; margin: 0 -8px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: var(--foreground); font: inherit; font-size: 14px; font-weight: 500; text-align: left; cursor: pointer;"><sc-if value="{{detailsExpanded}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="m6 9 6 6 6-6"></path></svg></sc-if><sc-if value="{{detailsCollapsed}}" hint-placeholder-val="{{true}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="m9 18 6-6-6-6"></path></svg></sc-if>Details</button>
<sc-if value="{{detailsExpanded}}" hint-placeholder-val="{{false}}">
<dl style="display: flex; flex-direction: column; gap: 12px; margin: 0;">
<div style="display: flex; flex-direction: column; gap: 4px;">
<dt style="font-size: 12px; color: var(--muted-foreground);">Size</dt>
<dd style="margin: 0; font-size: 14px; font-variant-numeric: tabular-nums;">480 × 320</dd>
</div>
<div style="display: flex; flex-direction: column; gap: 4px;">
<dt style="font-size: 12px; color: var(--muted-foreground);">File</dt>
<dd style="margin: 0; font-size: 14px;"><span style="display: flex; align-items: center; gap: 4px;"><code style="min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px;">{{filePath}}</code><button type="button" aria-label="Copy path" style="display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--muted-foreground); cursor: pointer;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg></button></span></dd>
</div>
<div style="display: flex; flex-direction: column; gap: 4px;">
<dt style="font-size: 12px; color: var(--muted-foreground);">{{importsLabel}}</dt>
<dd style="margin: 0; font-size: 14px;">
<sc-if value="{{hasImports}}" hint-placeholder-val="{{true}}">
<ul style="display: flex; flex-direction: column; margin: 0 -8px; padding: 0; list-style: none;">
<sc-for list="{{imports}}" as="name"><li><button type="button" style="display: block; width: 100%; box-sizing: border-box; padding: 4px 8px; overflow: hidden; border: 0; border-radius: 8px; background: transparent; text-align: left; text-overflow: ellipsis; white-space: nowrap; font: inherit; font-size: 14px; color: var(--foreground); cursor: pointer;">{{name}}</button></li></sc-for>
</ul>
<sc-if value="{{hasMore}}" hint-placeholder-val="{{false}}">
<button type="button" aria-expanded="{{moreExpanded}}" style="display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; margin: 2px -8px 0; padding: 4px 8px; border: 0; border-radius: 8px; background: transparent; font: inherit; font-size: 12px; font-weight: 500; color: var(--muted-foreground); cursor: pointer;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{moreRotate}});"><path d="m6 9 6 6 6-6"></path></svg>{{moreLabel}}</button>
</sc-if>
</sc-if>
<sc-if value="{{noImports}}" hint-placeholder-val="{{false}}">
<span style="color: var(--muted-foreground);">None</span>
</sc-if>
</dd>
</div>
</dl>
</sc-if>
</section>
<sc-if value="{{showVariantBoard}}" hint-placeholder-val="{{false}}">
<section aria-label="Variants" style="display: flex; flex-direction: column; gap: 8px;">
<h3 style="margin: 0; font-size: 12px; font-weight: 400; color: var(--muted-foreground);">Variants</h3>
<p style="margin: 0; font-size: 14px; color: var(--foreground);">Variant of Dialog: Simpler</p>
<sc-if value="{{showUnchanged}}" hint-placeholder-val="{{true}}">
<p role="status" style="margin: 0; padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--secondary); font-size: 13px; line-height: 20px; color: var(--foreground);">Not changed yet</p>
</sc-if>
<span style="display: inline-flex; align-items: center; justify-content: center; align-self: flex-start; gap: 8px; height: 34px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--background); color: var(--foreground); font-size: 13px; font-weight: 500; white-space: nowrap;">Compare</span>
</section>
</sc-if>
<button type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--background); color: var(--foreground); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg>Play</button>
</sc-if>
</aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"light","options":["light","dark"]},"approval":{"editor":"enum","default":"none","options":["none","new","approved","changed","queued"]},"imports":{"editor":"enum","default":"3","options":["3","0","10","10-expanded"]},"unchanged":{"editor":"enum","default":"yes","options":["yes","no"]},"shared":{"editor":"enum","default":"no","options":["no","yes"]},"menu":{"editor":"enum","default":"none","options":["none","open"]},"mode":{"editor":"enum","default":"default","options":["default","imports","multi","variant"]},"$preview":{"width":288,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    const { approval, imports, theme, mode } = this.props
    const multi = mode === 'multi'
    const sharedSection = multi && this.props.shared === 'yes'
    const detailsOpen = mode === 'imports'
    const allNames = String(imports) === '0' ? [] : String(imports).startsWith('10') ? ['CanvasSidebar', 'CanvasFrame', 'CanvasToolbar', 'CanvasFocusBar', 'CanvasToast', 'CanvasZoomBar', 'CanvasInspector', 'CanvasThread', 'CanvasSearch', 'CanvasSettings'] : ['Button', 'Icons', 'Badge']
    const expanded = String(imports) === '10-expanded'
    const names = expanded ? allNames : allNames.slice(0, 3)
    const hidden = allNames.length - 3
    const badge = {
      new: { text: 'New', bg: 'var(--info)', fg: 'var(--info-foreground)' },
      approved: { text: 'Approved', bg: 'var(--success)', fg: 'var(--success-foreground)' },
      changed: { text: 'Changed since approval', bg: 'var(--warning)', fg: 'var(--warning-foreground)' },
    }[approval]
    return {
      themeClass: theme === 'dark' ? 'dark' : '',
      theme: theme === 'dark' ? 'dark' : 'light',
      title: multi ? '3 boards selected' : mode === 'variant' ? 'DialogVariantSimpler' : 'Dialog',
      subtitle: multi ? 'Button, Dialog, Table' : 'Confirmation dialog',
      isMulti: multi,
      showDelete: sharedSection,
      notShared: !sharedSection,
      menuOpen: multi && this.props.menu === 'open',
      boardName: mode === 'variant' ? 'DialogVariantSimpler' : 'Dialog',
      showApproval: ['new', 'changed', 'queued', 'approved'].includes(approval),
      detailsExpanded: detailsOpen,
      detailsCollapsed: !detailsOpen,
      notMulti: !multi,
      showVariantBoard: mode === 'variant',
      showUnchanged: this.props.unchanged !== 'no',
      filePath: mode === 'variant' ? 'design/DialogVariantSimpler.dc.html' : 'design/Dialog.dc.html',
      importsLabel: `Imports (${allNames.length})`,
      imports: names,
      hasImports: names.length > 0,
      noImports: names.length === 0,
      hasMore: hidden > 0,
      moreExpanded: expanded ? 'true' : 'false',
      moreRotate: expanded ? '180deg' : '0deg',
      moreLabel: expanded ? 'Show fewer' : `Show ${hidden} more imports`,
      hasBadge: Boolean(badge),
      badgeText: badge ? badge.text : '',
      badgeBg: badge ? badge.bg : 'transparent',
      badgeFg: badge ? badge.fg : 'inherit',
      queued: approval === 'queued',
      showApprovalForm: approval !== 'approved',
    }
  }
}
</script>
</body>
</html>
