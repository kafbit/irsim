<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Canvas focus bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.cv-root{--pick:#14161a;--background:#ffffff;--foreground:#14161a;--card:#ffffff;--secondary:#f4f4f2;--muted:#efefeb;--muted-foreground:#5a606b;--accent:#f4f4f2;--border:#e4e4e0;--border-strong:#d6d7d2;--primary:#14161a;--primary-foreground:#ffffff;--destructive:#9a2a1a;--success:#e3f1e8;--success-foreground:#1b6b3a;--warning:#fdf0e2;--warning-foreground:#8a4a0b;--info:#e8f0fb;--info-foreground:#1e4e8c;--highlight:#f2a33a;--shell:#efefed;--surface:#fafaf8;--input:#8a8f98;--ring:#14161a}
.cv-root.dark{--pick:#14161a;--background:#111214;--foreground:#ecece8;--card:#1a1b1e;--secondary:#26272b;--muted:#26272b;--muted-foreground:#a3a7ae;--accent:#26272b;--border:#2d2e33;--border-strong:#3b3c42;--primary:#ecece8;--primary-foreground:#14161a;--destructive:#ff8f80;--success:#15301f;--success-foreground:#86d6a6;--warning:#3b2a14;--warning-foreground:#f3b66f;--info:#14263e;--info-foreground:#93bcf0;--highlight:#f2a33a;--shell:#0b0c0d;--surface:#121315;--input:#666b74;--ring:#ecece8}
</style>
</helmet>
<div dir="ltr" lang="en" class="cv-root {{themeClass}}" style="display: flex; align-items: center; justify-content: center; width: 100%; min-height: var(--cv-h, 100vh); background: var(--cv-bg, var(--shell)); font-family: system-ui, sans-serif; color: var(--foreground); font-size: 14px;">
<div role="status" style="display: flex; align-items: center; gap: 12px; box-sizing: border-box; padding: 4px 4px 4px 12px; border: 1px solid #2563eb; border-radius: 12px; background: var(--card); font-size: 14px; box-shadow: 0 14px 36px rgba(20,22,26,0.14);">
<span style="max-width: 256px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"><bdi style="font-weight: 500;">{{title}}</bdi> is focused</span>
<span style="color: var(--muted-foreground);"><kbd style="padding: 0 4px; border: 1px solid var(--border); border-radius: 4px; font-family: system-ui, sans-serif; font-size: 12px;">Esc</kbd> to exit</span>
<button type="button" style="display: inline-flex; align-items: center; justify-content: center; height: 24px; padding: 0 8px; border: 1px solid #2563eb; border-radius: 8px; background: #2563eb; color: #ffffff; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;">Exit</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"light","options":["light","dark"]},"title":{"editor":"text","default":"Reservations"},"$preview":{"width":380,"height":40}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      themeClass: this.props.theme === 'dark' ? 'dark' : '',
      title: this.props.title,
    }
  }
}
</script>
</body>
</html>
