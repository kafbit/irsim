<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Canvas arrange dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.cv-root{--pick:#14161a;--background:#ffffff;--foreground:#14161a;--card:#ffffff;--secondary:#f4f4f2;--muted:#efefeb;--muted-foreground:#5a606b;--accent:#f4f4f2;--border:#e4e4e0;--border-strong:#d6d7d2;--primary:#14161a;--primary-foreground:#ffffff;--destructive:#9a2a1a;--destructive-tint:#fbe9e6;--rented:#f1ecfa;--rented-foreground:#4f2d8a;--success:#e3f1e8;--success-foreground:#1b6b3a;--warning:#fdf0e2;--warning-foreground:#8a4a0b;--info:#e8f0fb;--info-foreground:#1e4e8c;--highlight:#f2a33a;--shell:#efefed;--surface:#fafaf8;--input:#8a8f98;--ring:#14161a}
.cv-root.dark{--pick:#14161a;--background:#111214;--foreground:#ecece8;--card:#1a1b1e;--secondary:#26272b;--muted:#26272b;--muted-foreground:#a3a7ae;--accent:#26272b;--border:#2d2e33;--border-strong:#3b3c42;--primary:#ecece8;--primary-foreground:#14161a;--destructive:#ff8f80;--destructive-tint:#3b1814;--rented:#281f3b;--rented-foreground:#bda7ec;--success:#15301f;--success-foreground:#86d6a6;--warning:#3b2a14;--warning-foreground:#f3b66f;--info:#14263e;--info-foreground:#93bcf0;--highlight:#f2a33a;--shell:#0b0c0d;--surface:#121315;--input:#666b74;--ring:#ecece8}
</style>
</helmet>
<div dir="ltr" lang="en" class="cv-root {{themeClass}}" style="position: relative; display: flex; align-items: center; justify-content: center; box-sizing: border-box; width: 100%; min-height: var(--cv-h, 100vh); padding: 20px; background: var(--shell); font-family: system-ui, sans-serif; color: var(--foreground); font-size: 14px;">
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(20,22,26,0.45);"></div>
<div role="dialog" aria-modal="true" aria-label="Arrange boards" style="position: relative; display: flex; flex-direction: column; gap: 16px; width: 360px; box-sizing: border-box; padding: 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); box-shadow: 0 14px 36px rgba(20,22,26,0.14);">
<header style="display: flex; flex-direction: column; gap: 4px;">
<h2 style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 600;">Arrange boards</h2>
<p style="margin: 0; font-size: 14px; color: var(--muted-foreground);">Re-lay the boards of this section.</p>
</header>
<div role="radiogroup" aria-label="Layout" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;"><sc-for list="{{tidyOptions}}" as="opt"><button type="button" role="radio" aria-checked="{{opt.on}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 64px; min-width: 0; padding: 0; border: 1px solid {{opt.border}}; border-radius: 10px; background: {{opt.bg}}; color: var(--foreground); font: inherit; font-size: 12px; font-weight: 500; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{opt.d}}"></path></svg>{{opt.label}}</button></sc-for></div>
<div style="display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 12px; color: var(--muted-foreground);">Gap</span><div style="display: flex; align-items: center; height: 34px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--input); border-radius: 10px; font-size: 14px; color: var(--foreground);">40</div></div>
<sc-if value="{{tidyGrid}}" hint-placeholder-val="{{false}}"><div style="display: flex; align-items: flex-end; gap: 8px;"><div style="display: flex; flex-direction: column; flex: 1; gap: 4px; min-width: 0;"><span style="font-size: 12px; color: var(--muted-foreground);">Columns</span><div style="display: flex; align-items: center; height: 34px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--input); border-radius: 10px; font-size: 14px; color: var(--foreground);">3</div></div><span style="padding-bottom: 8px; font-size: 14px; color: var(--muted-foreground);">×</span><div style="display: flex; flex-direction: column; flex: 1; gap: 4px; min-width: 0;"><span style="font-size: 12px; color: var(--muted-foreground);">Rows</span><div style="display: flex; align-items: center; height: 34px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--input); border-radius: 10px; font-size: 14px; color: var(--foreground);">2</div></div></div></sc-if>
<sc-if value="{{tidyWrap}}" hint-placeholder-val="{{false}}"><div style="display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 12px; color: var(--muted-foreground);">Width</span><div style="display: flex; align-items: center; height: 34px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--input); border-radius: 10px; font-size: 14px; color: var(--foreground);">1200</div></div></sc-if>
<footer style="display: flex; align-items: center; justify-content: flex-end; gap: 8px;">
<button type="button" style="display: inline-flex; align-items: center; justify-content: center; height: 34px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--background); color: var(--foreground); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;">Cancel</button>
<button type="button" style="display: inline-flex; align-items: center; justify-content: center; height: 34px; padding: 0 12px; border: 1px solid var(--primary); border-radius: 10px; background: var(--primary); color: var(--primary-foreground); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;">Arrange</button>
</footer>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"light","options":["light","dark"]},"tidy":{"editor":"enum","default":"row","options":["row","column","wrap","grid"]},"$preview":{"width":640,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const { theme } = this.props
    const tidy = ['row', 'column', 'wrap', 'grid'].includes(this.props.tidy) ? this.props.tidy : 'row'
    const tidyIcons = { row: 'M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2zM9 3v18M15 3v18', column: 'M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2zM21 9H3M21 15H3', wrap: 'M16 16l-3 3 3 3M3 12h14.5a1 1 0 0 1 0 7H13M3 19h6M3 5h18', grid: 'M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2zM3 9h18M3 15h18M9 3v18M15 3v18' }
    const tidyOptions = ['row', 'column', 'wrap', 'grid'].map((key) => ({
      label: key[0].toUpperCase() + key.slice(1),
      d: tidyIcons[key],
      on: key === tidy,
      bg: key === tidy ? 'var(--accent)' : 'transparent',
      border: key === tidy ? 'var(--primary)' : 'var(--border)',
    }))
    return { themeClass: theme === 'dark' ? 'dark' : '', tidyOptions, tidyGrid: tidy === 'grid', tidyWrap: tidy === 'wrap' }
  }
}
</script>
</body>
</html>
