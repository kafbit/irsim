<x-dc>
<helmet>
<style>
body{margin:0}
.ip-root{--pick:#14161a;--background:#ffffff;--foreground:#14161a;--card:#ffffff;--secondary:#f4f4f2;--muted-foreground:#5a606b;--accent:#f4f4f2;--border:#e4e4e0;--border-strong:#d6d7d2;--primary:#14161a;--primary-foreground:#ffffff;--destructive:#9a2a1a;--destructive-tint:#fbe9e6;--success:#e3f1e8;--success-foreground:#1b6b3a;--warning:#fdf0e2;--warning-foreground:#8a4a0b;--info:#e8f0fb;--info-foreground:#1e4e8c;--highlight:#f2a33a;--shell:#efefed;--surface:#fafaf8;--input:#8a8f98;--ring:#14161a;--popover:#ffffff;--muted:#efefeb;--play:#2563eb;--play-hover:#1d4ed8;--mock-bg:#f6f6f3;--mock-ink:#14161a;--mock-on-ink:#ecece8;--mock-card:#ffffff;--mock-line:#e4e4e0;--mock-bar:#d6d7d2;--mock-accent:#2563eb}
.ip-root.dark{--pick:#14161a;--background:#111214;--foreground:#ecece8;--card:#1a1b1e;--secondary:#26272b;--muted-foreground:#a3a7ae;--accent:#26272b;--border:#2d2e33;--border-strong:#3b3c42;--primary:#ecece8;--primary-foreground:#14161a;--destructive:#ff8f80;--destructive-tint:#3b1814;--success:#15301f;--success-foreground:#86d6a6;--warning:#3b2a14;--warning-foreground:#f3b66f;--info:#14263e;--info-foreground:#93bcf0;--highlight:#f2a33a;--shell:#0b0c0d;--surface:#121315;--input:#666b74;--ring:#ecece8;--popover:#1a1b1e;--muted:#26272b;--play:#60a5fa;--play-hover:#93c5fd}
</style>
</helmet>
<div dir="ltr" lang="en" role="dialog" aria-label="Choose icon" class="ip-root {{themeClass}}" style="display: flex; flex-direction: column; gap: 8px; box-sizing: border-box; width: 288px; padding: 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--popover); color: var(--foreground); font-family: system-ui, sans-serif; font-size: 14px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);">
<div style="display: flex; align-items: center; gap: 8px; height: 36px; box-sizing: border-box; padding: 0 10px; border: 1px solid {{searchBorder}}; border-radius: 8px; color: var(--muted-foreground);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M21 21l-4.34-4.34M3 11a8 8 0 1 0 16 0a8 8 0 1 0 -16 0"></path></svg><span style="min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; color: {{searchColor}};">{{searchText}}</span></div>
<sc-if value="{{hasIcons}}" hint-placeholder-val="{{true}}">
<div style="display: grid; grid-template-columns: repeat(8, 32px); grid-auto-rows: 32px;">
<sc-for list="{{icons}}" as="icon"><button type="button" aria-label="{{icon.name}}" aria-pressed="{{icon.pressed}}" style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; box-sizing: border-box; padding: 0; border: 0; border-radius: 8px; background: {{icon.bg}}; box-shadow: {{icon.ring}}; color: var(--foreground); cursor: pointer;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{icon.d}}"></path></svg></button></sc-for>
</div>
</sc-if>
<sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
<div style="display: flex; align-items: center; justify-content: center; height: 96px; font-size: 14px; color: var(--muted-foreground);">No icons match</div>
</sc-if>
<div style="display: flex; align-items: center; justify-content: space-between; padding-top: 4px; border-top: 1px solid var(--border);"><button type="button" style="height: 28px; margin-top: 4px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: var(--foreground); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;">Default</button><span style="margin-top: 4px; font-size: 12px; color: var(--muted-foreground); font-variant-numeric: tabular-nums;">{{countLabel}}</span></div>
</div>
</x-dc>

const TAGS = {"shopping-cart": "cart shopping", "shopping-basket": "cart basket shopping", "shopping-bag": "cart bag shopping", "store": "cart shop shopping"}
class Component extends DCLogic {
  renderVals() {
    const { theme, selected } = this.props
    const query = String(this.props.query || '').trim().toLowerCase()
    const names = query === '' ? COMMON : Object.keys(ICONS).filter((name) => name.includes(query) || (TAGS[name] || '').split(' ').some((tag) => tag.includes(query)))
    const icons = names.map((name) => ({
      name,
      d: ICONS[name],
      pressed: name === selected,
      bg: name === selected ? 'var(--accent)' : 'transparent',
      ring: name === selected ? '0 0 0 2px var(--ring)' : 'none',
    }))
    return {
      themeClass: theme === 'dark' ? 'dark' : '',
      searchText: query === '' ? 'Search icons' : String(this.props.query).trim(),
      searchColor: query === '' ? 'var(--muted-foreground)' : 'var(--foreground)',
      searchBorder: query === '' ? 'var(--input)' : 'var(--ring)',
      icons,
      hasIcons: icons.length > 0,
      empty: icons.length === 0,
      countLabel: query === '' ? '1,600 icons' : `${icons.length} ${icons.length === 1 ? 'match' : 'matches'}`,
