<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Comments panel: no session</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<dc-import name="CanvasThread" state="open" sessions="none" theme="{{theme}}" hint-size="320px,820px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"light","options":["light","dark"]},"$preview":{"width":320,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme }
  }
}
</script>
</body>
</html>
